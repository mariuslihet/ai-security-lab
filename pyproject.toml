[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-lab"
version = "0.1.0"
description = "Production-ready open-source LLM security testing and guardrails evaluation laboratory."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AI Security Lab Team", email = "security@ai-security-lab.local"}
]
keywords = [
    "llm-security",
    "prompt-injection",
    "jailbreak",
    "red-teaming",
    "guardrails",
    "owasp-llm-top-10"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.5.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
all = [
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "boto3>=1.34.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
ai-security-lab = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
