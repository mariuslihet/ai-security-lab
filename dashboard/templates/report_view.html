<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — AI Security Lab Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --border: #e4e4e7;
      --border-subtle: #f4f4f5;
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --badge-green-bg: #f0fdf4;
      --badge-green-text: #15803d;
      --badge-green-border: #bbf7d0;
      --badge-red-bg: #fef2f2;
      --badge-red-text: #b91c1c;
      --badge-red-border: #fecaca;
      --badge-amber-bg: #fffbeb;
      --badge-amber-text: #b45309;
      --badge-amber-border: #fde68a;
      --badge-gray-bg: #f4f4f5;
      --badge-gray-text: #52525b;
      --badge-gray-border: #e4e4e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --surface: #111113;
        --border: #27272a;
        --border-subtle: #1f1f23;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --badge-green-bg: #052e16;
        --badge-green-text: #4ade80;
        --badge-green-border: #14532d;
        --badge-red-bg: #450a0a;
        --badge-red-text: #f87171;
        --badge-red-border: #7f1d1d;
        --badge-amber-bg: #451a03;
        --badge-amber-text: #fbbf24;
        --badge-amber-border: #78350f;
        --badge-gray-bg: #18181b;
        --badge-gray-text: #a1a1aa;
        --badge-gray-border: #27272a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    /* Print styling: clean PDF export */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0;
      }
      .no-print { display: none !important; }
      .doc-sheet {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        padding: 0 !important;
      }
      table, tr, td, th {
        page-break-inside: avoid;
      }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: var(--border-subtle);
    }

    .btn-primary {
      background: var(--text-primary);
      border: 1px solid var(--text-primary);
      color: var(--surface);
    }
    .btn-primary:hover {
      opacity: 0.9;
    }

    /* The "Sheet" / Document Surface */
    .doc-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px 56px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
    }

    /* Document Header */
    .doc-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }

    .doc-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .doc-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .doc-h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .doc-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-blocked, .badge-safe, .badge-pass {
      background: var(--badge-green-bg);
      color: var(--badge-green-text);
      border-color: var(--badge-green-border);
    }
    .badge-exposed, .badge-fail, .badge-critical {
      background: var(--badge-red-bg);
      color: var(--badge-red-text);
      border-color: var(--badge-red-border);
    }
    .badge-warning, .badge-high {
      background: var(--badge-amber-bg);
      color: var(--badge-amber-text);
      border-color: var(--badge-amber-border);
    }
    .badge-idle, .badge-none {
      background: var(--badge-gray-bg);
      color: var(--badge-gray-text);
      border-color: var(--badge-gray-border);
    }

    /* Report Content Formatting */
    .report-body {
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .report-body h1, .report-body h2, .report-body h3 {
      color: var(--text-primary);
      font-weight: 600;
    }

    .report-body h1 {
      font-size: 20px;
      margin-top: 32px;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .report-body h2 {
      font-size: 15px;
      margin-top: 32px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .report-body h3 {
      font-size: 13.5px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .report-body p {
      margin-bottom: 14px;
    }

    .report-body ul, .report-body ol {
      margin-left: 20px;
      margin-bottom: 14px;
    }

    .report-body li {
      margin-bottom: 6px;
    }

    .report-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* Tables */
    .report-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 12.5px;
    }

    .report-body th {
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 11.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--border-subtle);
    }

    .report-body td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .report-body tr:hover td {
      background: var(--border-subtle);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Code & Pre */
    .report-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .report-body pre {
      background: var(--border-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 16px 0;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .report-body pre code {
      background: transparent;
      padding: 0;
      border: none;
    }

    /* Document Footer */
    .doc-footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Top Action Bar (hidden on print) -->
    <header class="action-bar no-print">
      <div class="brand-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span>AI Security Lab / Audit Report Viewer</span>
      </div>
      <div class="btn-group">
        <a href="{{ raw_url }}" class="action-btn btn-secondary" target="_blank" download>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Raw {{ format_label }}
        </a>
        <button onclick="window.print()" class="action-btn btn-primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Print / Save PDF
        </button>
      </div>
    </header>

    <!-- Document Sheet -->
    <main class="doc-sheet">

      <!-- Header -->
      <div class="doc-header">
        <div class="doc-meta-row">
          <span class="doc-id">{{ report_id }}</span>
          <span class="status-badge {{ badge_class }}">{{ verdict }}</span>
        </div>
        <h1 class="doc-h1">{{ title }}</h1>
        <div class="doc-desc">{{ subtitle }}</div>
      </div>

      <!-- Rendered Body -->
      <div class="report-body">
        {{ rendered_html | safe }}
      </div>

      <!-- Footer -->
      <div class="doc-footer">
        <span>AI Security Lab · Automated Defensive Red-Teaming Artifact</span>
        <span class="tabular-nums">{{ timestamp }}</span>
      </div>

    </main>

  </div>

</body>
</html>
